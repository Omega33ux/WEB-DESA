{% extends 'base.html' %}
{% load static %}

{% block title %}
{{ berita.judul }}
{% endblock %}

{% block content %}

<section class="bg-success text-white py-5 mt-5">

    <div class="container">

        <h1>{{ berita.judul }}</h1>

        <p>
            📅 {{ berita.tanggal }}
            |
            ✍ Pemerintah Desa Sumur Bandung
        </p>

    </div>

</section>

<section class="container py-5">

    <img src="{% static berita.gambar %}"
         class="img-fluid rounded shadow mb-4"
         style="width:100%;height:500px;object-fit:cover;">

    <p style="line-height:34px;text-align:justify;font-size:18px;">

        {{ berita.isi|linebreaks }}

    </p>

    <a href="/" class="btn btn-success mt-4">

        ← Kembali ke Beranda

    </a>

</section>

{% endblock %}
